    function _moveTip(e) {

        if (x + tw > window.innerWidth  - 8) x = e.clientX - tw - 14;
        if (y - th < 8)                      y = e.clientY + 20;
        tip.style.left = x + 'px';
        tip.style.top  = y + 'px';
    }
})();
